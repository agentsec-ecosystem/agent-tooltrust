version: "1.0"
posture: strict
environments:
  development: 0.0
  staging: 0.1
  production: 0.7
data_classes:
  public: 0.0
  internal: 0.2
rules:
  - decision: deny
    action: exec
    environment: production
    reason: "Shell execution is blocked in production."
  - decision: escalate
    action: exec
    environment: staging
    reason: "Shell execution in staging requires approval."
