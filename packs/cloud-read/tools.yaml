version: "1.0"
posture: balanced
environments:
  development: 0.0
  production: 0.5
data_classes:
  public: 0.0
  internal: 0.2
rules:
  - decision: deny
    action: delete
    tool: describe_instances
    reason: "Delete actions are not covered by this read-only pack."
  - decision: escalate
    action: write
    environment: production
    reason: "Write actions in cloud require approval."
