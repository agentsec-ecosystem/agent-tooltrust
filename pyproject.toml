[project]
name = "agent-tooltrust"
version = "0.1.0"
description = "A pre-execution, deterministic policy decision point for tool-using AI agents. Evaluate every proposed tool call against declarative policy and return allow / audit / escalate / deny."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deghosal-2026" }]
keywords = [
    "agent",
    "policy",
    "authorization",
    "safety",
    "llm",
    "ai",
    "risk",
    "governance",
    "tool-use",
    "mcp",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
urls.Homepage = "https://github.com/deghosal-2026/agent-tooltrust"
urls.Repository = "https://github.com/deghosal-2026/agent-tooltrust"
urls.Issues = "https://github.com/deghosal-2026/agent-tooltrust/issues"
dependencies = [
    "fastmcp>=3.4",
    "mcp>=1.28",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "watchfiles>=0.22",
]

[project.scripts]
tooltrust = "agent_tooltrust.cli:main"

[project.optional-dependencies]
llm = [
    "openai>=1.30",
]
postgres = [
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tooltrust"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/test_cli_integration.py" = ["S603", "S607"]
"tests/test_scanner.py" = ["RUF001", "RUF003"]
"tests/test_validators_dims.py" = ["S108"]
# RUF001/RUF003: the whole point of F-89 is tables/tests full of
# deliberately ambiguous Unicode characters (Cyrillic/Greek lookalikes).
"src/agent_tooltrust/engine/normalize.py" = ["RUF001", "RUF003"]
"tests/test_normalize.py" = ["RUF001", "RUF003"]
"tests/test_engine.py" = ["RUF001"]
"tests/test_acceptance_matrix.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "pydantic_ai.*",
    "agents.*",
]
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
omit = ["src/agent_tooltrust/adapters/langgraph.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that may take longer to complete",
    "field: field tests against real agents from GitHub",
]
