services:
  tooltrust:
    build: .
    ports:
      - "9000:8000"
    volumes:
      - tooltrust-state:/root/.tooltrust
    environment:
      TOOLTRUST_ESCALATIONS_FILE: /root/.tooltrust/escalations.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json; urllib.request.urlopen('http://localhost:8000/audit/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  tooltrust-state:
