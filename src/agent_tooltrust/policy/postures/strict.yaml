version: 1.0.0
posture: strict
environments:
  development:
    criticality: '0.0'
  staging:
    criticality: '0.1'
  production:
    criticality: '0.7'
data_classes:
  public:
    sensitivity: '0.0'
  internal:
    sensitivity: '0.2'
  restricted:
    sensitivity: '0.5'
  customer_pii:
    sensitivity: '1.0'
risk_weights:
  tool_category: '1.0'
  action_class: '1.0'
  environment: '1.0'
  data_sensitivity: '1.0'
  agent_class: '1.0'
rules:
- decision: deny
  tool: '*'
  action: delete
  environment: '*'
  data_class: '*'
  reason: Deletes are blocked by default.
- decision: deny
  tool: '*'
  action: grant
  environment: '*'
  data_class: '*'
  reason: Grant operations are always blocked.
- decision: deny
  tool: '*'
  action: write
  environment: production
  data_class: '*'
  reason: Writes in production are blocked under strict policy.
- decision: escalate
  tool: '*'
  action: write
  environment: '*'
  data_class: '*'
  reason: Write actions require approval under strict policy.
escalation:
  threshold: '0.5'
  ttl_seconds: '300'
audit:
  sink: jsonl
  path: ~/.tooltrust/audit.jsonl
  postgres_url: 'null'
